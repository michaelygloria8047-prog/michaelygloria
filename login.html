<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login_style.css">
    <script>try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
</head>
<body>
    <div class="form-container">
        <h2 id="formTitle">Login</h2>
        <form id="authForm">
            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <!-- Show Password Checkbox (only for Login) -->
            <div class="show-password" id="showPasswordContainer">
                <input type="checkbox" id="showPassword" onclick="togglePasswordVisibility()">
                <label for="showPassword">Show Password</label>
            </div>

            <!-- Confirm password field for sign-up form -->
            <label for="confirmPassword" id="confirmPasswordLabel" style="display: none;">Confirm Password</label>
            <input type="password" id="confirmPassword" style="display: none;">
            
            <!-- Password match message -->
            <p id="passwordMatchMessage" style="display: none;"></p>

            <!-- Shown on the Sign Up form only -->
            <p class="demo-note" id="demoNote" hidden>This is a demo site: accounts are saved only in your own browser. Please do not use a real password.</p>

            <button type="button" onclick="handleSubmit()">Login</button>
            <p id="errorMessage"></p>

            <!-- Toggle link to switch between forms -->
            <p id="toggleText">Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></p>
        </form>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle"></button>

    <!-- Embedded JavaScript -->
    <script>
        let isLogin = true;
        function toggleForm() {
            const formTitle = document.getElementById('formTitle');
            const confirmPassword = document.getElementById('confirmPassword');
            const confirmPasswordLabel = document.getElementById('confirmPasswordLabel');
            const submitButton = document.querySelector('#authForm button');
            const toggleText = document.getElementById('toggleText');
            const showPasswordContainer = document.getElementById('showPasswordContainer');

            // Clear form fields when toggling
            document.getElementById('authForm').reset();
            document.getElementById('errorMessage').textContent = ''; // Clear any error message

            if (isLogin) {
                // Switch to Sign-Up form
                formTitle.textContent = 'Sign Up';
                confirmPassword.style.display = 'block';
                confirmPasswordLabel.style.display = 'block';
                submitButton.textContent = 'Sign Up';
                toggleText.innerHTML = 'Already have an account? <a href="#" onclick="toggleForm()">Login</a>';
                showPasswordContainer.style.visibility = 'hidden'; // Hide without shifting layout
                document.getElementById('demoNote').hidden = false;
                isLogin = false;
            } else {
                // Switch to Login form
                formTitle.textContent = 'Login';
                confirmPassword.style.display = 'none';
                confirmPasswordLabel.style.display = 'none';
                submitButton.textContent = 'Login';
                toggleText.innerHTML = 'Don\'t have an account? <a href="#" onclick="toggleForm()">Sign Up</a>';
                showPasswordContainer.style.visibility = 'visible'; // Show Show Password checkbox
                document.getElementById('demoNote').hidden = true;
                isLogin = true;
            }
        }

        /* ---------- Account helpers ----------
        Accounts are saved in this browser only (localStorage), so every visitor has their own
        list of accounts. Passwords are never saved as plain text: they are salted and hashed. */
        const USERS_KEY = 'infot2_users';

        // SHA-256 (works on every browser, with or without https)
        const SHA_K = [
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
            0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
            0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
            0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
            0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
            0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
            0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];

        function utf8Bytes(str) {
            const out = [];
            for (let i = 0; i < str.length; i++) {
                let c = str.charCodeAt(i);
                if (c < 128) {
                    out.push(c);
                } else if (c < 2048) {
                    out.push(192 | (c >> 6), 128 | (c & 63));
                } else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
                    const d = str.charCodeAt(++i);
                    c = 0x10000 + ((c & 0x3ff) << 10) + (d & 0x3ff);
                    out.push(240 | (c >> 18), 128 | ((c >> 12) & 63), 128 | ((c >> 6) & 63), 128 | (c & 63));
                } else {
                    out.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
                }
            }
            return out;
        }

        function sha256(text) {
            const rotr = (v, n) => (v >>> n) | (v << (32 - n));
            const b = utf8Bytes(text);
            const bitLen = b.length * 8;
            b.push(0x80);
            while (b.length % 64 !== 56) { b.push(0); }
            const hi = Math.floor(bitLen / 4294967296), lo = bitLen >>> 0;
            b.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255,
                   (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);
            const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
            const w = new Array(64);
            for (let i = 0; i < b.length; i += 64) {
                for (let t = 0; t < 16; t++) {
                    w[t] = (b[i + 4 * t] << 24) | (b[i + 4 * t + 1] << 16) | (b[i + 4 * t + 2] << 8) | b[i + 4 * t + 3];
                }
                for (let t = 16; t < 64; t++) {
                    const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
                    const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
                    w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
                }
                let [a, bb, c, d, e, f, g, hh] = h;
                for (let t = 0; t < 64; t++) {
                    const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const t1 = (hh + S1 + ch + SHA_K[t] + w[t]) | 0;
                    const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                    const maj = (a & bb) ^ (a & c) ^ (bb & c);
                    const t2 = (S0 + maj) | 0;
                    hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
                }
                h[0] = (h[0] + a) | 0; h[1] = (h[1] + bb) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
                h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
            }
            return h.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
        }

        function newSalt() {
            const bytes = new Uint8Array(16);
            if (window.crypto && window.crypto.getRandomValues) {
                window.crypto.getRandomValues(bytes);
            } else {
                for (let i = 0; i < bytes.length; i++) { bytes[i] = Math.floor(Math.random() * 256); }
            }
            return Array.prototype.map.call(bytes, x => ('0' + x.toString(16)).slice(-2)).join('');
        }

        function hashPassword(password, salt) {
            let h = salt + ':' + password;
            for (let i = 0; i < 1000; i++) { h = sha256(h + salt + password); }
            return h;
        }

        // Can this browser save data? (it can not in some private windows or when site data is blocked)
        function storageReady() {
            try {
                localStorage.setItem('infot2_test', '1');
                localStorage.removeItem('infot2_test');
                return true;
            } catch (e) {
                return false;
            }
        }

        function loadUsers() {
            try {
                const data = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
                return (data && typeof data === 'object' && !Array.isArray(data)) ? data : {};
            } catch (e) {
                return {};
            }
        }

        function saveUsers(users) {
            try {
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                return true;
            } catch (e) {
                return false;
            }
        }

        // Usernames are not case-sensitive. The "u_" prefix keeps odd names safe.
        function userKey(username) { return 'u_' + username.toLowerCase(); }

        function handleSubmit() {
            const username = document.getElementById('username').value.trim().replace(/\s+/g, ' '); // spaces are allowed; extra spaces are tidied
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = '';

            if (!storageReady()) {
                errorMessage.textContent = 'Your browser is blocking site data, so accounts cannot be saved. Please allow cookies/site data or use a normal (non-private) window.';
                return;
            }

            if (isLogin) {
                if (!username || !password) {
                    errorMessage.textContent = 'Please enter your username and password';
                    return;
                }

                const users = loadUsers();
                const key = userKey(username);
                const account = Object.prototype.hasOwnProperty.call(users, key) ? users[key] : null;

                if (!account) {
                    // No account with this username yet: take the user to the Sign Up page
                    toggleForm();
                    document.getElementById('username').value = username;
                    if (window.petPopup) {
                        petPopup({
                            icon: '\uD83E\uDD96',
                            title: 'No account yet',
                            text: "We couldn't find an account with that username, so we took you to the Sign Up page. Already registered? Tap Login and check your username.",
                            buttons: [{ label: 'OK', primary: true }]
                        });
                    } else {
                        alert('No account found. Please sign up first.');
                    }
                    return;
                }

                if (hashPassword(password, account.salt) === account.hash) {
                    try {
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('infot2_current', account.name);
                    } catch (e) {}
                    const welcome = 'Welcome back, ' + account.name + '! You are logged in.';
                    if (window.petFlash) {
                        petFlash(welcome); // shown on the home page
                    } else {
                        alert(welcome);
                    }
                    window.location.href = 'index.html'; // Redirect to home page if credentials are valid
                } else {
                    errorMessage.textContent = 'Invalid username or password';
                }
            } else {
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!username || !password || !confirmPassword) {
                    errorMessage.textContent = 'Please fill out all fields';
                } else if (username.length < 3 || username.length > 30 || !/^[\p{L}\p{N}_.-]+( [\p{L}\p{N}_.-]+)*$/u.test(username)) {
                    errorMessage.textContent = 'Username must be 3-30 characters: letters, numbers, spaces, dot, dash or underscore';
                } else if (password.length < 6) {
                    errorMessage.textContent = 'Password must be at least 6 characters';
                } else if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords do not match';
                } else {
                    const users = loadUsers();
                    const key = userKey(username);

                    if (Object.prototype.hasOwnProperty.call(users, key)) {
                        errorMessage.textContent = 'That username is already taken. Please choose another one.';
                        return;
                    }

                    const salt = newSalt();
                    users[key] = { name: username, salt: salt, hash: hashPassword(password, salt), created: Date.now() };

                    // Save, then read it back to be sure the account really exists
                    const saved = saveUsers(users) && Object.prototype.hasOwnProperty.call(loadUsers(), key);
                    if (!saved) {
                        errorMessage.textContent = 'Sorry, your account could not be saved. Please check that your browser allows site data and try again.';
                        return;
                    }

                    document.getElementById('authForm').reset();
                    toggleForm(); // Switch back to login form after sign-up
                    document.getElementById('username').value = username; // so they only need to type the password

                    if (window.petPopup) {
                        petPopup({
                            icon: '\uD83C\uDF89',
                            title: 'Account successfully created!',
                            text: 'You can now log in with your new username and password.',
                            buttons: [{ label: "OK, let's log in", primary: true }]
                        });
                    } else {
                        alert('Account created successfully! You can now log in.');
                    }
                }
            }
        }

        // Pressing Enter in a text box does the same as clicking the button
        document.getElementById('authForm').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
                e.preventDefault();
                handleSubmit();
            }
        });

        
function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }

        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('passwordMatchMessage');

            if (confirmPassword === "") {
                message.style.display = 'none';
            } else if (confirmPassword === password) {
                message.textContent = 'Passwords match';
                message.className = 'match-ok';
                message.style.display = 'block';
            } else {
                message.textContent = 'Passwords do not match';
                message.className = 'match-bad';
                message.style.display = 'block';
            }
        }
    </script>
<script>
    // Dark / light mode (remembered in localStorage)
    (function () {
        var root = document.documentElement;
        var btn = document.getElementById('themeToggle');
        function paint() {
            var light = root.dataset.theme === 'light';
            btn.textContent = light ? '\u263E\uFE0E' : '\u2600\uFE0E';
            btn.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
            btn.title = light ? 'Dark mode' : 'Light mode';
        }
        btn.addEventListener('click', function () {
            var next = root.dataset.theme === 'light' ? 'dark' : 'light';
            root.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
            paint();
        });
        paint();
    })();
</script>
<script src="pet.js"></script>
</body>
</html>
